# Netlify-Konfiguration für das Export-Repo Ben-Apps/gamechest-website.
# Das Repo enthält NUR den fertigen statischen Export (sites/gamechest/out aus app-websites) – Netlify baut nichts.
# Header und Weiterleitungen stehen in _headers und _redirects (Netlify liest beide nativ).
# Quelle: app-websites/sites/gamechest/netlify/netlify.toml – hier nicht von Hand ändern, sondern dort + neu deployen.

[build]
  publish = "."
  command = ""

# Keine HTML-Nachbearbeitung durch Netlify („Pretty URLs“ schrieb Links wie href="privacy.html" in href='/privacy' um).
# Die Rechtsseiten privacy/terms/support.html sollen live byte-gleich mit GrabGame/web/legal sein.
[build.processing]
  skip_processing = true
[build.processing.html]
  pretty_urls = false
